server:
  port: 8080

spring:
  application:
    name: api-gateway

  datasource:
    url: jdbc:postgresql://localhost:5433/order_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # схема уже создана order-service
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  cloud:
    gateway:
      routes:
        - id: order-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/orders/**, /api/users/**, /api/auth/**   # временно, потом /api/auth перенесём полностью в gateway

        - id: inventory-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/inventory/**, /api/products/**

        - id: notification-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/notifications/**

      default-filters:
        - RemoveRequestHeader=Cookie

jwt:
  secret: "SUPER_PAVEL_SECRET_KEY_SUPER_PAVEL_SECRET_KEY_123"
  access-expiration-ms: 900000      # 15 минут
  refresh-expiration-ms: 604800000  # 7 дней

logging:
  file:
    name: api-gateway/logs/api-gateway.log

  level:
    com.shop.apigateway: INFO
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: INFO
